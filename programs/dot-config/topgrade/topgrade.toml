[commands]
"tmux plugins" = "~/.config/tmux/plugins/tpm/bin/update_plugins all"
"Clear evalcache" = "zsh -ic clear_evalcache"
"Generate zsh completions" = "zsh -ic generate_zsh_completions"
"Compile zsh configurations" = "zsh -ic compile_zsh_configs"

